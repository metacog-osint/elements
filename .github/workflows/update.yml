name: update
# Hourly: collect every source, log what changed in history/ (new, changed and ended items: Elements' own historical
# record, kept after an item leaves the feed), commit data/ and history/ when their content changed, build site/ and
# publish it to GitHub Pages (https://elements.theintelligence.company/). A failing source keeps its last good data
# and never ends an item; a failed history step or a failed push still lets the site deploy and then fails the run, so it is seen. Free: public repo. One optional secret,
# FIRMS_MAP_KEY (a free NASA key).
#
# Private archive (the last step): every run's history/, data/ (with the files git does not keep), FIRMS cell files
# and deployed site/ also go to the PRIVATE repo metacog-osint/tic-archive (tools/tic_archive.py), where nothing is
# replaced or deleted. Secret TIC_ARCHIVE_TOKEN: contents read and write on tic-archive only.
#
# GitHub delays and drops scheduled runs under load: from 1 to 4 Nov 2026 a single hourly trigger ran about once every
# six hours. So the schedule fires four times an hour and the gate job skips the run when the site was deployed less
# than 45 minutes ago (a skipped run deploys nothing, so it can't hold the next one back).
on:
  schedule:
    - cron: "5,20,35,50 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ["data/**", "history/**"]   # the bot's own data and history commits must not start a run
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: update
  cancel-in-progress: false
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      deployments: read
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - id: check
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last=$(gh api "repos/$GITHUB_REPOSITORY/deployments?environment=github-pages&per_page=1" --jq '.[0].created_at // empty' || true)
          if [ -n "$last" ] && [ $(( $(date -u +%s) - $(date -u -d "$last" +%s) )) -lt 2700 ]; then
            echo "skip=yes" >> "$GITHUB_OUTPUT"
            echo "Site deployed at $last, under 45 minutes ago: skipping this run."
          else
            echo "Last deployment: ${last:-none found}. Running."
          fi
  update:
    needs: gate
    if: needs.gate.outputs.skip != 'yes'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url || steps.deployment_last.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Collect
        id: collect
        env:
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}  # optional: without it, FIRMS's public files are read instead
        run: python tools/elements.py collect
      # A failure here is a gap in the history, never a missed deploy: the step is allowed to fail so the site still
      # builds and deploys, and the last step of the job fails the run afterwards so the gap is seen (retention
      # fix, 18 Nov 2026). data/ is committed, so tools/history_backfill.py can rebuild the log's items.
      - name: History (log new, changed and ended items against the last run; archive yellow MeteoAlarm warnings)
        id: history
        continue-on-error: true
        run: python tools/elements.py history
      # Hourly FIRMS cells go to a monthly release, not git. Create-only; a failure never stops the run.
      - name: Store this hour's FIRMS cells
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/elements.py firms-store || echo "::warning::FIRMS cell store failed; this hour is missing from the release"
      - name: Commit data and history when their content changed
        id: commit
        run: |
          if [ -n "$(git status --porcelain -- data history ':!data/health.json' ':!data/nws_recent.json')" ]; then
            git config user.name "elements-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data history
            git commit -q -m "data: $(date -u +%Y-%m-%dT%H:%MZ)"
            # GitHub sometimes refuses a push (an error 500 on 4 Nov 2026). Retry; if it still fails, keep going so
            # the site is still deployed, upload data/ and history/ as an artifact (next step) and fail the run at
            # the end, so nothing this run collected is discarded unseen.
            pushed=no
            for i in 1 2 3; do
              if git push -q origin HEAD:main; then pushed=yes; break; fi
              echo "::warning::data push attempt $i failed"
              sleep $((i * 15)); git pull -q --rebase origin main || true
            done
            if [ "$pushed" != yes ]; then
              echo "::error::data not committed this run (all pushes failed); data/ and history/ are uploaded as an artifact"
              echo "unpushed=yes" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "no content change"
          fi
      - name: Keep this run's data and history when the push failed
        if: steps.commit.outputs.unpushed == 'yes'
        uses: actions/upload-artifact@v4
        with:
          name: unpushed-data-${{ github.run_id }}
          path: |
            data
            history
          retention-days: 30
          if-no-files-found: error
      - name: Build site
        run: python tools/elements.py build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
      # GitHub's Pages side fails now and then with nothing wrong in the run: deploy-pages reads the artifact list
      # half a second after the upload and finds 0 artifacts, or Pages answers "Deployment failed, try again later".
      # That was every failed run from 17 to 22 Nov 2026 (22 of about 330), and it got much worse from 24 Nov: 45 of
      # about 100 runs on 24-25 Nov, every one "Found 0 artifact(s)", though the artifact is listed when read later.
      # So wait 10 seconds for GitHub's artifact list to catch up, then try, and try again twice, after 20 and 60 s.
      - name: Let GitHub list the uploaded artifact before deploying
        run: sleep 10
      - id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - name: Wait before the second deploy attempt
        if: steps.deployment.outcome == 'failure'
        run: sleep 20
      - id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - name: Wait before the last deploy attempt
        if: steps.deployment.outcome == 'failure' && steps.deployment_retry.outcome == 'failure'
        run: sleep 60
      - id: deployment_last
        if: steps.deployment.outcome == 'failure' && steps.deployment_retry.outcome == 'failure'
        uses: actions/deploy-pages@v4
      # After the deploy, so a failure above never blocks the live site, but the run still ends red.
      - name: Fail the run if history or the push failed
        if: always() && (steps.history.outcome == 'failure' || steps.commit.outputs.unpushed == 'yes')
        run: |
          echo "::error::history step: ${{ steps.history.outcome }}; data push failed: ${{ steps.commit.outputs.unpushed == 'yes' }}. The site was still deployed; see the unpushed-data artifact and tools/history_backfill.py --continue."
          exit 1
      # What this public repository replaces each run or never commits, to the PRIVATE repo metacog-osint/tic-archive,
      # one lane each (release elements-<lane>-YYYY-MM; a snapshot per run, only changed files uploaded, nothing
      # replaced or deleted):
      #   history      history/ as the History step left it: the log, the open items (state.json, rewritten every
      #                run) and the record-only lanes. Committed to main too. Only when that step succeeded, so a
      #                failed or skipped step never archives a half-written history/ as the newest snapshot.
      #   data         data/ after the collection, with the files git does not keep: firms.json (the whole FIRMS
      #                read, low-confidence cells and daily counts included), meteoalarm.json (every warning in
      #                force) and nws_recent.json (the NWS catch-up). Each run replaces them. Only when the collection
      #                succeeded. Scanned for the FIRMS key, which never reaches these files: a copy would be REDACTED.
      #   firms-cells  this run's FIRMS cell files from .firms-cells/, the same bytes the store step uploads to the
      #                public release, and also the files the release does not take: a later run's file for an hour
      #                the release already holds, and an hour whose upload failed. Only when the store wrote any.
      #   site         site/ as deployed (feed.geojson, ended.geojson and the map's files), replaced by the next
      #                deploy. Only when a deploy attempt succeeded.
      # After the deploy and the step above, so it never holds the live site. Each lane is tried even if another
      # failed; a missing token or any failed lane turns the run red.
      - name: Private archive (history, data, FIRMS cells and site, to tic-archive)
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.TIC_ARCHIVE_TOKEN }}
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}   # only so the data lane can redact it
          COLLECTED: ${{ steps.collect.outcome }}
          HISTORY: ${{ steps.history.outcome }}
          DEPLOYED: ${{ steps.deployment.outcome == 'success' || steps.deployment_retry.outcome == 'success' || steps.deployment_last.outcome == 'success' }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::secret TIC_ARCHIVE_TOKEN is not set, so nothing went to the private archive"; exit 1
          fi
          failed=0
          if [ "$HISTORY" = "success" ]; then
            python tools/tic_archive.py put --program elements --lane history --src history || failed=1
          else
            echo "history: the History step did not succeed, so history/ was not archived"
          fi
          if [ "$COLLECTED" = "success" ]; then
            python tools/tic_archive.py put --program elements --lane data --src data \
              --redact-env-if-set FIRMS_MAP_KEY || failed=1
          else
            echo "data: the collection did not succeed, so data/ was not archived"
          fi
          if [ -d .firms-cells ] && [ -n "$(ls -A .firms-cells)" ]; then
            python tools/tic_archive.py put --program elements --lane firms-cells --src .firms-cells || failed=1
          else
            echo "firms-cells: the store wrote no FIRMS cell file this run"
          fi
          if [ "$DEPLOYED" = "true" ]; then
            python tools/tic_archive.py put --program elements --lane site --src site || failed=1
          else
            echo "site: not deployed this run, so not archived"
          fi
          if [ "$failed" != 0 ]; then
            echo "::error::a lane did not reach the private archive this run (see above)"; exit 1
          fi
