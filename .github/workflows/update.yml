name: update
# Hourly: collect every source, commit data/ when its content changed, build site/ and publish it to GitHub Pages
# (https://metacog-osint.github.io/elements/). A failing source keeps its last good data; nothing here fails the run
# except a broken build. Free: public repo. One optional secret, FIRMS_MAP_KEY (a free NASA key).
on:
  schedule:
    - cron: "35 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ["data/**"]
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Collect
        env:
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}  # optional: without it, FIRMS's public files are read instead
        run: python tools/elements.py collect
      - name: Commit data when its content changed
        run: |
          if [ -n "$(git status --porcelain -- data ':!data/health.json')" ]; then
            git config user.name "elements-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data
            git commit -q -m "data: $(date -u +%Y-%m-%dT%H:%MZ)"
            git push -q origin HEAD:main
          else
            echo "no content change"
          fi
      - name: Build site
        run: python tools/elements.py build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
      - id: deployment
        uses: actions/deploy-pages@v4
