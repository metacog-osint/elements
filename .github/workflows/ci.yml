name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Doctrine kit copy and registers (tic-doctrine)
        run: python doctrine/kit/tic.py kitcheck && python doctrine/kit/tic.py registers doctrine
      - name: Tests
        run: python tests/test_elements.py && python tests/test_volcanoes.py && python tests/test_weather.py && python tests/test_tsunami_drought.py && python tests/test_meteoalarm.py && python tests/test_emsc_nifc.py
      - name: Feed from the committed data passes the kit's linter
        run: python tools/elements.py check
